name: skill-sync-check
on:
  pull_request:
    paths:
      - 'skills/superfix/SKILL.md'
      - 'skills/superfix/references/**'
      - 'tests/**'
      - 'README.md'
      - 'docs/**'
      - '.claude-plugin/plugin.json'
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: test -f skills/superfix/references/execute.md && echo references-resolve
      - run: python3 tests/preservation-check.py .
      - run: n=$(wc -l < skills/superfix/references/workorder.md); if [ "$n" -gt 250 ]; then echo "WORKORDER-TOO-LONG $n"; exit 1; fi; echo "workorder.md $n lines"
      - run: n=$(wc -l < skills/superfix/references/criteria.md); if [ "$n" -gt 390 ]; then echo "CRITERIA-TOO-LONG $n"; exit 1; fi; echo "criteria.md $n lines"
      - run: python3 tests/crit-15-check.py skills/superfix/references/crit.py
      - run: bash tests/project-tests.sh
      - run: python3 tests/docs-check.py .
      - run: bash tests/redact-check-tests.sh
      - run: bash tests/style-check-tests.sh
      - run: bash tests/bare-command-tests.sh
      - run: bash tests/solved-close-tests.sh
      - run: bash tests/skill-text-tests.sh
      - run: bash tests/leak-check.sh
  workorder-macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: bash tests/workorder-kinds-tests.sh
      # tests/workorder-tests.sh clones the private superfix-testbed repo, so it runs by hand (TESTBED=<clone> bash tests/workorder-tests.sh), not in CI.
      - run: bash tests/workorder-criteria-tests.sh
